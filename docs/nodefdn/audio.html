<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dopamine Machines Node Occupy Audio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000" />
  <link rel="stylesheet" href="audio.css">
</head>
<body>
  <header>
    <h1>Dopamine Machines Node Occupy Audio</h1>
    <div class="root">
      <label for="root">Root</label>
      <input id="rootRange" type="range" min="50" max="1000" step="0.01">
      <input id="root" class="mono short" type="number" min="20" max="4000" step="0.01">
      <span>Hz</span>
      <span id="rootNote" class="mono dim"></span>
      <button id="rootRandom">Random (250–500)</button>
    </div>
  </header>

  <main>
    <section class="pane" id="spinny"></section>
    <section class="pane" id="blinky"></section>
  </main>

  <script type="module" src="./audio.js"></script>
</body>
</html>
